name: csmith-fuzz

# Differential fuzzing of the compiler against csmith-generated programs, one
# job per architecture. Five minutes of fuzzing reaches several hundred cases
# per job, which is where the yield sits: the trial that opened this found one
# defect per two dozen programs. A finding the week's issue does not hold yet
# is then reduced with cvise inside a budget of its own, so the comment carries
# a program of tens of lines beside the unreduced case. Findings go to the
# week's issue and the cases to a release used as a store, so the job's own
# log is not the record.
#
# The two lanes run one at a time. Both would otherwise open the week's issue
# concurrently on the first finding of a week -- GitHub has no create-if-absent
# for an issue -- and the week would start with two of them.
#
# Each lane runs the harness's legs one after another (`csmith_fuzz.py
# --leg`): the default, an inlining cap of 4096, a codegen_test badc under
# two registers per bank with the allocation check on, and csmith 2.4.0's
# GNU extensions. A leg's name joins its findings' signatures, so the week's
# issue holds each leg's findings apart. Ubuntu packages csmith 2.3.0, which
# has none of those extensions; 2.4.0 is master past the last tag, built at
# CSMITH_COMMIT and cached.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "file findings (off: print what would be filed)"
        type: boolean
        default: false
      minutes:
        description: "fuzzing budget per job"
        type: string
        default: "5"
      reduce_minutes:
        description: "reduction budget per job (0: file unreduced)"
        type: string
        default: "10"
  schedule:
    # Daily at 03:41 UTC, off the :00/:30 marks the fleet crowds and clear of
    # the nightly asm-fuzz job at 07:17.
    - cron: "41 3 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fuzz:
    name: fuzz (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # Four legs of five minutes of fuzzing and up to ten of reduction each,
    # on top of two badc builds and, on a cold cache, the generator's. The
    # cap is a hang backstop, not the budget.
    timeout-minutes: 120
    env:
      CSMITH_COMMIT: 0cdc710315cfee9035e22ef4363ca479270d1934
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.os }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install csmith
        # Debian and Ubuntu split the generator from its runtime headers:
        # `csmith` carries /usr/bin/csmith, `libcsmith-dev` carries
        # /usr/include/csmith/csmith.h, which every generated program includes.
        # Both are in universe, 2.3.0 on noble and later, as is `cvise`,
        # the reducer the harness prefers. cmake and m4 build csmith 2.4.0.
        run: ./scripts/apt_resilient_install.sh csmith libcsmith-dev cvise cmake m4
      - name: csmith 2.4.0 from the cache
        id: csmith24
        uses: actions/cache@v4
        with:
          path: ~/csmith-2.4.0
          key: csmith-${{ env.CSMITH_COMMIT }}-${{ matrix.os }}
      - name: build csmith 2.4.0
        if: steps.csmith24.outputs.cache-hit != 'true'
        run: |
          src="$RUNNER_TEMP/csmith"
          git clone https://github.com/csmith-project/csmith "$src"
          git -C "$src" checkout --detach "$CSMITH_COMMIT"
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/csmith-2.4.0"
          cmake --build "$src/build" -j "$(nproc)"
          cmake --install "$src/build"
      - name: build badc
        # The pressure leg's badc reads BADC_MAX_GPR / BADC_MAX_FPR and
        # BADC_VERIFY_ALLOC, which only a codegen_test build does.
        run: |
          cargo build --release --locked --features full --bin badc
          cp target/release/badc target/release/badc-full
          cargo build --release --locked --features "codegen_test full" --bin badc
          cp target/release/badc target/release/badc-pressure
      - name: fuzz
        # The dispatch inputs reach the shell through the environment rather
        # than through expression interpolation, which would splice whatever
        # was typed into the command line. A leg that fails leaves the others
        # to run; the step fails after them.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINUTES: ${{ inputs.minutes || '5' }}
          REDUCE_MINUTES: ${{ inputs.reduce_minutes || '10' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          publish=
          if [ "$PUBLISH" = "true" ]; then publish=--publish; fi
          status=0
          for leg in default inline-cap-4096 pressure gnu; do
            badc=target/release/badc-full
            generator=()
            case $leg in
              pressure) badc=target/release/badc-pressure ;;
              gnu) generator=(--csmith "$HOME/csmith-2.4.0/bin/csmith"
                              --csmith-include "$HOME/csmith-2.4.0/include") ;;
            esac
            python3 scripts/csmith_fuzz.py \
              --leg "$leg" \
              --minutes "$MINUTES" \
              --reduce-minutes "$REDUCE_MINUTES" \
              --badc "$badc" \
              "${generator[@]}" \
              --out-dir "fuzz-cases/$leg" \
              --report "fuzz-report-$leg.json" \
              $publish || status=1
          done
          exit $status
      - name: publish the run's cases and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: csmith-fuzz-${{ matrix.os }}
          path: |
            fuzz-cases
            fuzz-report-*.json
          if-no-files-found: ignore
          retention-days: 14
