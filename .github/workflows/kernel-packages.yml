name: kernel-packages

# Distribution packages built from the badc-compiled Linux kernel, and a VM
# that installs them. Each lane builds the distribution's own kernel
# configuration (`packages.py --config vendor`: the image's /boot/config,
# mirrored on the vendor-deps release and carried to the pinned release by
# olddefconfig), so the kernel has what the image boots and checks with --
# Fedora's btrfs root, Ubuntu's multipath, the crypto modules. badc compiles
# every kernel C translation unit -- no fallback to the reference compiler --
# the kernel's own bindeb-pkg /
# binrpm-pkg targets produce the package, the package is published as a run
# artifact, and a stock distribution cloud image boots under qemu, installs
# it, reboots into it and is probed: systemd reaches multi-user, the package
# scriptlets produced depmod data and an initramfs, `modprobe` loads packaged
# modules, disk and network I/O work, the kernel is untainted, dmesg is clean
# against a stock-kernel baseline taken from the same image before the
# install, and `/proc/version` names badc as the compiler.
#
# Not on the push path: a distribution configuration is a full kernel. Measured
# on the boxes at the pinned release (units and links are badc's, none falling
# back; the VM phase under KVM with 4 guest cores):
#
#                     units   links   build + package    vm phase, kvm
#   x86_64  ubuntu    26254   15644   63 min (12 cpu)        104 s
#   x86_64  fedora    21767   11540   48 min (12 cpu)        103 s
#   aarch64 ubuntu    30605   19112   64 min  (8 cpu)        195 s
#   aarch64 fedora    23547   13097   41 min  (8 cpu)        126 s
#
# GitHub-hosted runners have 4 cores and no /dev/kvm, so the VM runs under
# TCG; with defconfig the TCG VM phase took 3 min (x86_64) and 40 min
# (aarch64, 28 of them `rpm -ivh` regenerating the initramfs with dracut)
# against 40 s and 2.5 min under KVM. The caps below scale those figures by
# the core counts; a runner's cores are slower than the boxes', so they are
# estimates, not measurements. With debug information on, as both
# distributions configure it, a tree takes 43 GB and a deb lane's staging and
# -dbg package 18 GB more, which is why the runner's unused toolchains are
# removed first.
#
# It carries no schedule either. The corpus it builds is a pinned release at a
# fixed configuration, so a run repeats the previous run's work unless a commit
# changed the compiler -- and the commits that do are already gated by ci.yml's
# per-push `kernel` job. A daily run of four lanes at these costs buys a result
# that is almost always identical to the last one. It runs when someone asks
# for it.
#
# ci.yml's `kernel` job keeps the per-push gate -- same "badc compiles every
# unit, zero fallbacks" contract, booted with a marker initramfs under the
# badc-built emulator, and with badc as the tree's LD as well. This workflow
# adds the distribution dimension on demand and on a labelled pull request.
#
# It is also the linker contrast, which is why the push path does not carry
# one. A `linker: reference` dispatch builds the same configuration but leaves
# LD to kbuild's default, so "GNU ld consumes badc's kernel objects and the
# result boots" is gated here -- into a stock distribution userspace rather
# than a marker initramfs. The two separate a compiler defect from a linker
# one: a kernel that boots reference-linked and not badc-linked is the
# linker's, and one that boots neither way is the compiler's.
#
# What a TCG run does not cover, relative to KVM: the guest sees an emulated
# CPU rather than the host's, so the kernel's KVM-guest paths (kvm-clock and
# the paravirtualised spinlocks behind CONFIG_KVM_GUEST) stay unexercised,
# and instruction timing differs. Everything this gate asserts is guest
# behaviour whose instructions TCG executes.

on:
  # No architecture or format input: the four lanes run in parallel, so
  # selecting one saves no wall time. A single-lane run is a local
  # packages.py invocation.
  workflow_dispatch:
    inputs:
      linker:
        description: "linker for the kernel build"
        type: choice
        options: [badc, reference]
        default: badc
  pull_request:
    # Opt-in per pull request: add the `kernel-packages` label to run it.
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    if: >-
      github.event_name != 'pull_request'
      || github.event.label.name == 'kernel-packages'
    name: ${{ matrix.arch }} ${{ matrix.pkg }} (badc kernel, install + boot)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floors just under the measured unit counts of each distribution
          # configuration at the pinned release (in the table above), so a
          # build that compiled nothing cannot pass.
          #
          # `cpu` is the guest CPU model, stated per lane rather than left to
          # the emulator's default. `max` exposes LA57 on x86_64, so the lane
          # boots under 5-level paging -- which ci.yml's kernel lane does not,
          # since its guest takes the emulator's default model.
          #
          # Both packaging formats on both architectures: the kernel's own
          # bindeb-pkg and binrpm-pkg targets over the same tree, installed
          # into the distribution each format belongs to. `distro` and `pkg`
          # are stated rather than left to the architecture's default, which
          # is what previously fixed one format per architecture.
          - { os: ubuntu-24.04,     arch: x86_64,  distro: ubuntu, pkg: deb,
              floor: 26000, cpu: 'max' }
          - { os: ubuntu-24.04,     arch: x86_64,  distro: fedora, pkg: rpm,
              floor: 21500, cpu: 'max' }
          - { os: ubuntu-24.04-arm, arch: aarch64, distro: ubuntu, pkg: deb,
              floor: 30300, cpu: 'max' }
          - { os: ubuntu-24.04-arm, arch: aarch64, distro: fedora, pkg: rpm,
              floor: 23300, cpu: 'max' }
    runs-on: ${{ matrix.os }}
    # The platform's 6-hour limit: the build alone is estimated at three to
    # four hours on a runner. Each VM boot is separately bounded by
    # --vm-timeout, and the build and VM steps carry their own caps.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-packages-${{ matrix.arch }}
      - name: install kernel build, packaging and VM tools
        # The emulator is the distribution's. This lane's subject is the
        # package and the userspace that boots on it; the guest needs EFI
        # firmware, virtio and user networking, none of which the self-linked
        # emulator ci.yml's kernel lane boots under has a data directory for.
        # `rpm` carries rpmbuild, which the kernel's binrpm-pkg target drives;
        # `dwarves` carries pahole, without which olddefconfig drops the BTF
        # both distributions configure.
        env:
          EMU: ${{ matrix.arch == 'x86_64' && 'qemu-system-x86' || 'qemu-system-arm qemu-efi-aarch64' }}
        run: |
          ./scripts/apt_resilient_install.sh \
            flex bison bc libelf-dev libssl-dev xz-utils cpio kmod rsync \
            dpkg-dev debhelper rpm genisoimage qemu-utils dwarves zstd $EMU
      - name: free disk for the kernel tree
        # Preinstalled toolchains this job does not use, about 30 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: build badc
        run: cargo build --release --locked --features full --bin badc
      - name: fetch the pinned kernel release (sha256 verified)
        run: python demos/linux/setup.py --arch ${{ matrix.arch }} --cache "$RUNNER_TEMP/lk" --fetch-only
      - name: build the kernel with badc and package it
        # Fails when badc cannot compile a unit, when a unit falls back to
        # the reference compiler, when fewer units than the floor were
        # compiled, or when the kernel's packaging target rejects the tree.
        # The published packages are badc-linked, so the artefact matches
        # what the milestone claims: badc compiles, assembles and links.
        # `linker: reference` on a manual dispatch gives the contrast run,
        # which separates a compiler fault from a linker one when a package
        # regresses.
        timeout-minutes: 280
        env:
          # The runner's reference compiler is not the one the pinned kernel
          # was released against; its warnings are not this gate's subject.
          KCFLAGS: -Wno-error
        run: |
          tarball=$(python demos/linux/setup.py --cache "$RUNNER_TEMP/lk" --print-tarball)
          python demos/linux/packages.py --arch ${{ matrix.arch }} \
            --distro ${{ matrix.distro }} --pkg ${{ matrix.pkg }} \
            --tarball "$tarball" --phases config,tree,build,package \
            --config vendor \
            --linker ${{ inputs.linker || 'badc' }} \
            --expect-units ${{ matrix.floor }} \
            --workdir "$RUNNER_TEMP/pkg" \
            --report "$RUNNER_TEMP/pkg/package-${{ matrix.arch }}.json"
      - name: collect the packages for publication
        id: collect
        # The deb lands in the workdir (depth 1) and the rpm under the tree's
        # rpmbuild/RPMS/<arch> (depth 5); both are gathered flat so the
        # artifact unpacks to files a human can install directly. The artifact
        # name carries what is in it: architecture, kernel release, badc
        # version, commit.
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          find "$RUNNER_TEMP/pkg" -maxdepth 5 \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.buildinfo' \
               -o -name '*.changes' \) -exec cp -t "$out" {} +
          cp "$RUNNER_TEMP/pkg/package-${{ matrix.arch }}.json" \
             "$RUNNER_TEMP/pkg/manifest-${{ matrix.arch }}.txt" "$out"
          (cd "$out" && find . -maxdepth 1 \( -name '*.deb' -o -name '*.rpm' \) \
             -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS)
          test -s "$out/SHA256SUMS" || { echo "::error::no package collected"; exit 1; }
          release=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['release'])" \
            "$RUNNER_TEMP/pkg/package-${{ matrix.arch }}.json")
          badcver=$(./target/release/badc --version | head -1 | cut -d' ' -f2)
          echo "artifact=linux-badc-${{ matrix.pkg }}-${{ matrix.arch }}-$release-badc$badcver-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          cat "$out/SHA256SUMS"
      - name: publish the packages
        # Uploaded before the VM runs, so the packages reach the run page
        # even when it is the install or the boot that failed.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30
      - name: install the package in a stock cloud image and boot it
        # --accel tcg is stated rather than left to the probe: a runner that
        # grew a /dev/kvm should change this file, not silently change what
        # was measured. The cloud image is a vendor-deps release asset
        # verified against a pinned sha256 before it is booted.
        timeout-minutes: ${{ matrix.arch == 'x86_64' && 40 || 120 }}
        run: |
          python demos/linux/packages.py --arch ${{ matrix.arch }} \
            --distro ${{ matrix.distro }} --pkg ${{ matrix.pkg }} \
            --phases vm --accel tcg --vm-cpu '${{ matrix.cpu }}' \
            --vm-cpus 4 --vm-mem 4096 \
            --vm-timeout 2400 --install-timeout 3600 \
            --image-cache "$RUNNER_TEMP/images" \
            --workdir "$RUNNER_TEMP/pkg" \
            --report "$RUNNER_TEMP/pkg/vm-${{ matrix.arch }}.json"
      - name: publish the validation record
        # Covers the build phase as well as the VM phase: when the build
        # fails, the log, the manifest and the config deviations are the only
        # outputs that exist, and without them the run page carries no
        # diagnostic at all.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages-vm-${{ matrix.pkg }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/pkg/vm-${{ matrix.arch }}.json
            ${{ runner.temp }}/pkg/package-${{ matrix.arch }}.json
            ${{ runner.temp }}/pkg/console-${{ matrix.arch }}.log
            ${{ runner.temp }}/pkg/build-${{ matrix.arch }}.log
            ${{ runner.temp }}/pkg/manifest-${{ matrix.arch }}.txt
            ${{ runner.temp }}/pkg/config-deviations-${{ matrix.arch }}.txt
            ${{ runner.temp }}/pkg/cores/**
          if-no-files-found: ignore
          retention-days: 30
