name: kernel-packages

# Distribution packages built from the badc-compiled Linux kernel, and a VM
# that installs them. badc compiles every kernel C translation unit -- no
# fallback to the reference compiler -- the kernel's own bindeb-pkg /
# binrpm-pkg targets produce the package, the package is published as a run
# artifact, and a stock distribution cloud image boots under qemu, installs
# it, reboots into it and is probed: systemd reaches multi-user, the package
# scriptlets produced depmod data and an initramfs, `modprobe` loads packaged
# modules, disk and network I/O work, the kernel is untainted, dmesg is clean
# against a stock-kernel baseline taken from the same image before the
# install, and `/proc/version` names badc as the compiler.
#
# Not on the push path, and the reason is the accelerator. GitHub-hosted
# runners expose no /dev/kvm, so the VM runs under TCG. Measured on the boxes
# against the same packages and images, VM host cores capped at 4 to match a
# runner:
#
#              build + package   vm phase, kvm   vm phase, tcg
#   x86_64      5 min (12 cpu)       40 s            3 min
#   aarch64    11 min  (8 cpu)      2.5 min         40 min
#
# The aarch64 TCG figure is 28 min of `rpm -ivh` regenerating the initramfs
# with dracut and 11 min of boots and probes, and a runner's cores are slower
# than the box's, which is what --install-timeout below is sized for. Neither
# lane fits a push; both fit a nightly.
#
# ci.yml's `kernel` job keeps the per-push gate -- same "badc compiles every
# unit, zero fallbacks" contract, booted with a marker initramfs under the
# badc-built emulator. This workflow adds the distribution dimension on a
# nightly schedule, on demand, and on a labelled pull request.
#
# What a TCG run does not cover, relative to KVM: the guest sees an emulated
# CPU rather than the host's, so the kernel's KVM-guest paths (kvm-clock and
# the paravirtualised spinlocks behind CONFIG_KVM_GUEST) stay unexercised,
# and instruction timing differs. Everything this gate asserts is guest
# behaviour whose instructions TCG executes.

on:
  # No architecture input: both lanes run in parallel, so selecting one saves
  # no wall time. A single-architecture run is a local packages.py invocation.
  workflow_dispatch:
  schedule:
    # Nightly at 03:41 UTC: off the :00/:30 marks the fleet crowds, and clear
    # of the asm-fuzz lane.
    - cron: "41 3 * * *"
  pull_request:
    # Opt-in per pull request: add the `kernel-packages` label to run it.
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    if: >-
      github.event_name != 'pull_request'
      || github.event.label.name == 'kernel-packages'
    name: ${{ matrix.arch }} ${{ matrix.pkg }} (badc kernel, install + boot)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floors just under the measured defconfig unit counts at the
          # pinned release (2953 and 10489), so a build that compiled nothing
          # cannot pass. x86_64 defconfig builds virtio, ext4 and most of the
          # rest =y, aarch64 defconfig builds them =m -- which is why the
          # module-autoload dimension is real only on the aarch64 lane.
          #
          # `cpu` is the guest CPU model, stated per lane rather than left to
          # the emulator's default. `max` exposes LA57 on x86_64, so the lane
          # boots under 5-level paging -- which ci.yml's kernel lane does not,
          # since its guest takes the emulator's default model.
          - { os: ubuntu-24.04,     arch: x86_64,  pkg: deb, floor: 2900,
              cpu: 'max' }
          - { os: ubuntu-24.04-arm, arch: aarch64, pkg: rpm, floor: 10000,
              cpu: 'max' }
    runs-on: ${{ matrix.os }}
    # Roughly 2x the measured wall time, so a hang is bounded well below the
    # platform's 6-hour limit. Each VM boot is separately bounded by
    # --vm-timeout, and the build and VM steps carry their own caps.
    timeout-minutes: ${{ matrix.arch == 'x86_64' && 60 || 240 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-packages-${{ matrix.arch }}
      - name: install kernel build, packaging and VM tools
        # The emulator is the distribution's. This lane's subject is the
        # package and the userspace that boots on it; the guest needs EFI
        # firmware, virtio and user networking, none of which the self-linked
        # emulator ci.yml's kernel lane boots under has a data directory for.
        # `rpm` carries rpmbuild, which the kernel's binrpm-pkg target drives.
        env:
          EMU: ${{ matrix.arch == 'x86_64' && 'qemu-system-x86' || 'qemu-system-arm qemu-efi-aarch64' }}
        run: |
          ./scripts/apt_resilient_install.sh \
            flex bison bc libelf-dev libssl-dev xz-utils cpio kmod rsync \
            dpkg-dev debhelper rpm genisoimage qemu-utils $EMU
      - name: build badc
        run: cargo build --release --locked --features full --bin badc
      - name: fetch the pinned kernel release (sha256 verified)
        run: python demos/linux/setup.py --arch ${{ matrix.arch }} --cache "$RUNNER_TEMP/lk" --fetch-only
      - name: build the kernel with badc and package it
        # Fails when badc cannot compile a unit, when a unit falls back to
        # the reference compiler, when fewer units than the floor were
        # compiled, or when the kernel's packaging target rejects the tree.
        timeout-minutes: ${{ matrix.arch == 'x86_64' && 30 || 120 }}
        env:
          # The runner's reference compiler is not the one the pinned kernel
          # was released against; its warnings are not this gate's subject.
          KCFLAGS: -Wno-error
        run: |
          tarball=$(ls "$RUNNER_TEMP"/lk/linux-*.tar.xz | head -1)
          python demos/linux/packages.py --arch ${{ matrix.arch }} \
            --tarball "$tarball" --phases tree,build,package \
            --expect-units ${{ matrix.floor }} \
            --workdir "$RUNNER_TEMP/pkg" \
            --report "$RUNNER_TEMP/pkg/package-${{ matrix.arch }}.json"
      - name: collect the packages for publication
        id: collect
        # The deb lands in the workdir (depth 1) and the rpm under the tree's
        # rpmbuild/RPMS/<arch> (depth 5); both are gathered flat so the
        # artifact unpacks to files a human can install directly. The artifact
        # name carries what is in it: architecture, kernel release, badc
        # version, commit.
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          find "$RUNNER_TEMP/pkg" -maxdepth 5 \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.buildinfo' \
               -o -name '*.changes' \) -exec cp -t "$out" {} +
          cp "$RUNNER_TEMP/pkg/package-${{ matrix.arch }}.json" \
             "$RUNNER_TEMP/pkg/manifest-${{ matrix.arch }}.txt" "$out"
          (cd "$out" && find . -maxdepth 1 \( -name '*.deb' -o -name '*.rpm' \) \
             -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS)
          test -s "$out/SHA256SUMS" || { echo "::error::no package collected"; exit 1; }
          release=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['release'])" \
            "$RUNNER_TEMP/pkg/package-${{ matrix.arch }}.json")
          badcver=$(./target/release/badc --version | head -1 | cut -d' ' -f2)
          echo "artifact=linux-badc-${{ matrix.arch }}-$release-badc$badcver-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          cat "$out/SHA256SUMS"
      - name: publish the packages
        # Uploaded before the VM runs, so the packages reach the run page
        # even when it is the install or the boot that failed.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30
      - name: install the package in a stock cloud image and boot it
        # --accel tcg is stated rather than left to the probe: a runner that
        # grew a /dev/kvm should change this file, not silently change what
        # was measured. The cloud image is a vendor-deps release asset
        # verified against a pinned sha256 before it is booted.
        timeout-minutes: ${{ matrix.arch == 'x86_64' && 25 || 110 }}
        run: |
          python demos/linux/packages.py --arch ${{ matrix.arch }} \
            --phases vm --accel tcg --vm-cpu '${{ matrix.cpu }}' \
            --vm-cpus 4 --vm-mem 4096 \
            --vm-timeout 2400 --install-timeout 3600 \
            --image-cache "$RUNNER_TEMP/images" \
            --workdir "$RUNNER_TEMP/pkg" \
            --report "$RUNNER_TEMP/pkg/vm-${{ matrix.arch }}.json"
      - name: publish the validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages-vm-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/pkg/vm-${{ matrix.arch }}.json
            ${{ runner.temp }}/pkg/package-${{ matrix.arch }}.json
            ${{ runner.temp }}/pkg/console-${{ matrix.arch }}.log
            ${{ runner.temp }}/pkg/cores/**
          if-no-files-found: ignore
          retention-days: 30
