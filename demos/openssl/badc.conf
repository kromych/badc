# Configure targets naming badc as the compiler. Each inherits the host's
# stock target; README.md gives the reason for each field that differs.
# TODO: inherit cflags and ex_libs once the driver takes -pthread and -arch
# (https://github.com/kromych/badc/issues/1633).
my %targets = (
    "badc-darwin64-arm64" => {
        inherit_from     => [ "darwin64-arm64" ],
        cflags           => "",
        lflags           => "",
    },
    "badc-linux-x86_64" => {
        inherit_from     => [ "linux-x86_64" ],
        cflags           => "-m64",
        cppflags         => "-D_REENTRANT",
        ex_libs          => "-ldl -lpthread",
        lflags           => "--sysroot=/",
    },
    "badc-linux-aarch64" => {
        inherit_from     => [ "linux-aarch64" ],
        cflags           => "",
        cppflags         => "-D_REENTRANT",
        ex_libs          => "-ldl -lpthread",
        lflags           => "--sysroot=/",
    },
);
